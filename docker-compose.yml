services:
  mc:
    image: ${MC_IMAGE}
    container_name: mc
    ports:
      # Game port only. RCON (25575) is deliberately NOT published —
      # backup.sh reaches it via `docker exec`, not over the network.
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION}"
      MEMORY: "${MC_MEMORY}"
      DIFFICULTY: "${MC_DIFFICULTY}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS}"
      MOTD: "${MC_MOTD}"

      # --- access control ---
      WHITELIST_FILE: "/data/whitelist-source.txt"
      ENFORCE_WHITELIST: "TRUE"
      ONLINE_MODE: "TRUE"

      # --- performance ---
      # Aikar's G1GC flags: the single biggest win, reduces GC pause spikes.
      USE_AIKAR_FLAGS: "TRUE"
      # Tick cost scales roughly with the square of view distance.
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE}"

      # --- rcon: internal use only ---
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"

    volumes:
      - ./data:/data

    networks:
      - mc-net

    # --- hardening ---
    # Run as an unprivileged user from the start, never as root.
    #
    # This is required, not just preferred, alongside cap_drop: ALL. The
    # image's entrypoint only chowns /data and drops privileges when it
    # starts as uid 0 — and with no capabilities, root can do neither
    # (chown needs CAP_CHOWN, the user switch needs CAP_SETUID/SETGID), so
    # it dies with "failed switching to 'minecraft:minecraft'". Starting as
    # non-root skips that branch entirely.
    #
    # The flip side: nothing inside can fix ownership any more, so ./data on
    # the host must already belong to this uid. bootstrap.sh sets MC_UID and
    # MC_GID to whoever runs it, and server.sh checks before starting.
    user: "${MC_UID}:${MC_GID}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # --- resource ceiling ---
    # MC_MEMORY (JVM heap) must stay well below MC_MEM_LIMIT, or the
    # container gets OOM-killed when the JVM's off-heap usage is counted.
    mem_limit: ${MC_MEM_LIMIT}
    cpus: ${MC_CPUS}

    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 30s
      retries: 5

    stdin_open: true
    tty: true
    restart: unless-stopped

    # Docker's default is 10s, then SIGKILL. A large world can still be
    # flushing to disk at that point, and a killed save writes torn chunks.
    # Give the JVM room to shut down cleanly.
    stop_grace_period: 60s

networks:
  mc-net:
    driver: bridge
