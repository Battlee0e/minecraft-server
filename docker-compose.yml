services:
  mc:
    image: ${MC_IMAGE}
    container_name: mc
    ports:
      # Game port only. RCON (25575) is deliberately NOT published —
      # backup.sh reaches it via `docker exec`, not over the network.
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION}"
      MEMORY: "${MC_MEMORY}"
      DIFFICULTY: "${MC_DIFFICULTY}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS}"
      MOTD: "${MC_MOTD}"

      # --- access control ---
      # WHITELIST takes a name list and resolves each one to a UUID before
      # writing a real whitelist.json. server.sh fills it from
      # data/whitelist-source.txt, because compose can't read a file into a
      # variable.
      #
      # Do NOT go back to WHITELIST_FILE. That option is a file-to-file sync,
      # not a parser: it copies whatever you point it at straight over
      # whitelist.json, bare usernames and comment lines included. Paper then
      # rejects the result ("Expected a JsonArray but was JsonPrimitive"),
      # renames it to whitelist.json.backup and starts with an EMPTY
      # whitelist — which, with ENFORCE_WHITELIST, locks everyone out.
      #
      # Names here are merged into the existing whitelist, so players added
      # live with `rcon-cli whitelist add` survive a restart. The flip side is
      # that deleting a name from the file does not remove them — see the
      # README. Set EXISTING_WHITELIST_FILE=SYNCHRONIZE to invert that
      # trade-off and make the file authoritative.
      WHITELIST: "${MC_WHITELIST:-}"
      ENFORCE_WHITELIST: "TRUE"
      ONLINE_MODE: "TRUE"

      # --- performance ---
      # Aikar's G1GC flags: the single biggest win, reduces GC pause spikes.
      USE_AIKAR_FLAGS: "TRUE"
      # Tick cost scales roughly with the square of view distance.
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE}"

      # --- paper config patches ---
      # paper-global.yml lives in the gitignored data/ dir and is regenerated
      # state, so hand-editing it there leaves a setting that exists on one
      # machine and disappears with the next rebuild. PATCH_DEFINITIONS makes
      # the change declarative: patches/ is version-controlled and reapplied
      # on every start.
      #
      # Only the value is interpolated, and only from variables prefixed CFG_
      # (the image's REPLACE_ENV_VARIABLE_PREFIX default) — hence the second
      # name for what is one setting.
      PATCH_DEFINITIONS: "/patches"
      CFG_ALLOW_PISTON_DUPLICATION: "${MC_ALLOW_PISTON_DUPLICATION:-true}"
      CFG_ALLOW_UNSAFE_END_PORTAL_TELEPORTATION: "${MC_ALLOW_UNSAFE_END_PORTAL_TELEPORTATION:-true}"

      # --- rcon: internal use only ---
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${MC_RCON_PASSWORD}"

    volumes:
      - ./data:/data
      # Read-only: the image only reads patch definitions, never writes them.
      # Must be readable by uid 1000 — on the VPS the checkout is root-owned,
      # so the default 644/755 from git is what makes this work.
      - ./patches:/patches:ro

    networks:
      - mc-net

    # --- hardening ---
    # Run as an unprivileged user from the start, never as root. 1000 is the
    # image's own default user, so this needs no configuring.
    #
    # This is required, not just preferred, alongside cap_drop: ALL. The
    # image's entrypoint only chowns /data and drops privileges when it
    # starts as uid 0 — and with no capabilities, root can do neither
    # (chown needs CAP_CHOWN, the user switch needs CAP_SETUID/SETGID), so
    # it dies with "failed switching to 'minecraft:minecraft'". Starting as
    # non-root skips that branch entirely.
    #
    # The flip side: nothing inside can fix ownership any more, so ./data on
    # the host must belong to uid 1000. bootstrap.sh does that; server.sh
    # checks it before starting. MC_UID/MC_GID override it if you ever need
    # to, but they aren't in .env by default — 1000 just works.
    user: "${MC_UID:-1000}:${MC_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # --- resource ceiling ---
    # MC_MEMORY (JVM heap) must stay well below MC_MEM_LIMIT, or the
    # container gets OOM-killed when the JVM's off-heap usage is counted.
    mem_limit: ${MC_MEM_LIMIT}
    cpus: ${MC_CPUS}

    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 30s
      retries: 5

    stdin_open: true
    tty: true
    restart: unless-stopped

    # Docker's default is 10s, then SIGKILL. A large world can still be
    # flushing to disk at that point, and a killed save writes torn chunks.
    # Give the JVM room to shut down cleanly.
    stop_grace_period: 60s

networks:
  mc-net:
    driver: bridge
